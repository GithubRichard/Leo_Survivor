<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主角 · 八方向奔跑</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#222420;color:#d4cfbd;font:16px/1.65 system-ui,sans-serif}main{max-width:1240px;margin:auto;padding:32px 24px}h1{font-size:30px;margin:0}p{color:#a6a894}.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:20px 0}button{background:#42473b;border:1px solid #646b57;border-radius:6px;padding:9px 15px;color:#e1ddce;cursor:pointer;font:inherit}button.active{background:#8e793e;border-color:#b09955}button:focus-visible,a:focus-visible{outline:2px solid #d3ba73;outline-offset:3px}input{accent-color:#8e793e}a{color:#c2a860}.focus{display:grid;grid-template-columns:minmax(280px,1fr) minmax(260px,1fr);gap:24px;margin:24px 0}.stage,.card{background:#30342d;border:1px solid #484f40;border-radius:8px}.stage{display:grid;place-items:center;min-height:370px}canvas{display:block;width:100%;height:auto}.stage canvas{max-width:410px}.frames{display:flex;gap:8px}.frame{background:#30342d;border:1px solid #484f40;border-radius:6px;flex:1;min-width:0;text-align:center}.frame img{width:100%;height:170px;object-fit:contain}.frame span{display:block;padding:4px;font-size:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{padding:10px;cursor:pointer}.card.active{border-color:#c2a860}.card strong{display:block;text-align:center}.card small{display:block;color:#a6a894;text-align:center}#status{font-size:14px;color:#b6ac82}.info{border-top:1px solid #484f40;padding-top:20px;margin-top:26px}button:disabled{opacity:.5;cursor:wait}@media(max-width:750px){.focus{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}main{padding:20px 14px}}
</style></head><body><main>
<h1>主角 · 八方向奔跑</h1><p>东、南、西、北、东南、东北、西南、西北 · 每方向3张 · 共24张透明PNG</p>
<div class="controls"><button id="play" disabled>暂停</button><button id="step" disabled>下一帧</button><label>速度 <input id="fps" type="range" min="4" max="14" value="8"> <output id="fpsValue">8</output>帧/秒</label><span id="phase">第1帧</span></div>
<div id="directions" class="controls" aria-label="方向选择"></div><p id="status" role="status">正在载入24张奔跑帧…</p>
<div class="focus"><div class="stage"><canvas id="focus" width="820" height="740" aria-label="当前方向奔跑动画"></canvas></div><div><h2 id="selected">东 →</h2><p>可暂停后逐帧查看。播放顺序为 1 → 2 → 3 → 2，方向采用屏幕坐标。</p><div class="frames" id="frames"></div><p id="filenames"></p></div></div>
<div class="grid" id="grid"></div>
<div class="info"><p>保留暗黄外套、暗灰裤子和极简几何形体。PNG为独立帧；导入游戏时请按清单设置一致的尺寸和锚点。</p><a href="README.md">素材与导入说明</a> · <a href="manifest.json">动画清单</a> · <a href="prompts.json">生成提示词</a> · <a href="../preview.html">其他游戏素材</a></div>
</main><script src="alignment.js"></script><script>
const directions=[['east','东','→'],['south','南','↓'],['west','西','←'],['north','北','↑'],['southeast','东南','↘'],['northeast','东北','↗'],['southwest','西南','↙'],['northwest','西北','↖']];
const images={},order=[1,2,3,2];let selected='east',playing=true,index=0,last=0,ready=false;
const filename=(dir,frame)=>'player_run_'+dir+'_'+String(frame).padStart(2,'0')+'.png';
document.getElementById('directions').innerHTML=directions.map(([dir,name,arrow])=>`<button data-direction="${dir}">${name} ${arrow}</button>`).join('');
document.getElementById('grid').innerHTML=directions.map(([dir,name,arrow])=>`<button class="card" data-direction="${dir}" aria-label="选择${name}方向"><canvas id="canvas_${dir}" width="600" height="560"></canvas><strong>${name} ${arrow}</strong><small>3张奔跑帧</small></button>`).join('');
function choose(dir){selected=dir;document.getElementById('selected').textContent=directions.find(d=>d[0]===dir).slice(1).join(' ');document.querySelectorAll('[data-direction]').forEach(el=>el.classList.toggle('active',el.dataset.direction===dir));document.getElementById('frames').innerHTML=[1,2,3].map(frame=>`<a class="frame" href="${filename(dir,frame)}"><img src="${filename(dir,frame)}" alt="${dir} 第${frame}帧"><span>第${frame}帧</span></a>`).join('');document.getElementById('filenames').innerHTML=[1,2,3].map(frame=>`<a href="${filename(dir,frame)}" download>${filename(dir,frame)}</a>`).join('<br>');drawAll();}
document.querySelectorAll('[data-direction]').forEach(el=>el.onclick=()=>choose(el.dataset.direction));
function draw(canvas,dir,frame){const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);const ground=h*.89;ctx.strokeStyle='#60654e';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(w*.5,ground,w*.16,h*.027,0,0,Math.PI*2);ctx.stroke();const img=images[filename(dir,frame)];if(!img?.naturalWidth)return;const meta=window.RUN_ALIGNMENT?.[filename(dir,frame)];const scale=h*.64/(meta?.bodyHeight||img.naturalHeight*.72);const pivot=meta?.pivot||[img.naturalWidth*.5,img.naturalHeight*.86];ctx.drawImage(img,w*.5-pivot[0]*scale,ground-pivot[1]*scale,img.naturalWidth*scale,img.naturalHeight*scale);}
function drawAll(){const frame=order[index];draw(document.getElementById('focus'),selected,frame);for(const [dir]of directions)draw(document.getElementById('canvas_'+dir),dir,frame);document.getElementById('phase').textContent='第'+frame+'帧';}
document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'暂停':'播放';last=performance.now()};document.getElementById('step').onclick=()=>{playing=false;document.getElementById('play').textContent='播放';index=(index+1)%order.length;drawAll()};document.getElementById('fps').oninput=e=>document.getElementById('fpsValue').textContent=e.target.value;
choose('east');const failed=[];
Promise.all(directions.flatMap(([dir])=>[1,2,3].map(frame=>new Promise(resolve=>{const name=filename(dir,frame),img=new Image();images[name]=img;img.onload=resolve;img.onerror=()=>{failed.push(name);resolve()};img.src=name})))).then(()=>{ready=true;document.getElementById('status').textContent=failed.length?'缺少素材：'+failed.join('、'):'24 / 24 张已载入';document.getElementById('play').disabled=false;document.getElementById('step').disabled=false;drawAll()});
function animate(now){if(ready&&playing&&now-last>=1000/Number(document.getElementById('fps').value)){index=(index+1)%order.length;last=now;drawAll()}requestAnimationFrame(animate)}requestAnimationFrame(animate);
</script></body></html>
