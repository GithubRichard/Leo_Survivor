<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>末世生存 · 2D素材</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#222420;color:#d0cbb9;font:16px/1.7 system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:36px 24px}h1{font-size:30px;margin:0}p{color:#a5a594}button{background:#8e793e;border:0;border-radius:4px;padding:10px 20px;color:#fff;cursor:pointer;font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:16px}figure{margin:0;border:1px solid #484b40;background:#30332d;border-radius:8px;overflow:hidden}figure img{width:100%;aspect-ratio:3/2;object-fit:contain;display:block}figcaption{padding:12px 16px}small{display:block;color:#969985}.room{position:relative;max-width:760px;margin:20px auto;background:#30332d;border:1px solid #484b40;border-radius:8px;aspect-ratio:3/2}.room img{position:absolute;width:100%;inset:0}.room .roof{top:-8%;transition:opacity .2s}.room.inside .roof{opacity:0}.status{color:#c0a55e}.bar{width:300px;height:18px;background:#343633;border:2px solid #51534b;margin:8px 0}.fill{height:100%;background:#a5413c;width:100%}.stamina{background:#4e8051}input{accent-color:#8e793e}.ui{padding:20px;border:1px solid #484b40;margin:20px 0;border-radius:8px}a{color:#c0a55e}
</style>
<main><h1>末世生存 · 2D素材</h1><p>暗灰 / 暗黄 · 基础几何形体 · 半俯视。新版包括角色四方向、门的开关、捕兽夹命中状态和连续红绿状态条。</p>
<button id="enter">展示进入房屋</button> <span class="status" id="state">屋外：显示屋顶</span>
<div class="room" id="room"><img src="sprites-v1/house_base.png" alt="无屋顶房屋主体"><img class="roof" src="sprites-v1/house_roof.png" alt="独立屋顶"></div>
<p>此处演示屋顶层淡出；两张独立生成图的拼合仅作示意，正式导入时需校准屋顶位置、比例与墙层。角色移动和进屋判定由后续游戏逻辑实现。</p>
<div class="ui"><strong>左上角界面 · 填充变化示意</strong><div>血量 <output id="hpValue">12 / 12</output></div><div class="bar"><div class="fill" id="hpFill"></div></div><input id="hp" aria-label="血量" type="range" min="0" max="12" value="12"><div>体力 <output id="spValue">10 / 10</output></div><div class="bar"><div class="fill stamina" id="spFill"></div></div><input id="sp" aria-label="体力" type="range" min="0" max="10" value="10"></div>
<div class="ui"><strong>角色方向</strong><p>按屏幕方向：东→、南↓、西←、北↑。</p><div id="directions"></div><div class="grid"><figure><img id="playerDir" src="sprites-v2/player_south.png" alt="玩家当前方向"><figcaption>玩家</figcaption></figure><figure><img id="zombieDir" src="sprites-v2/zombie_south.png" alt="丧尸当前方向"><figcaption>丧尸</figcaption></figure></div></div>
<div class="ui"><strong>物体状态</strong><p><button id="trapToggle">展示捕兽夹命中</button> <button id="doorToggle">展示门开启</button></p><div class="grid"><figure><img id="trapState" src="sprites-v1/bear_trap.png" alt="捕兽夹"><figcaption id="trapCaption">捕兽夹：张开</figcaption></figure><figure><img id="yardState" src="sprites-v2/yard_gate_closed.png" alt="院门"><figcaption>院门</figcaption></figure><figure><img id="houseState" src="sprites-v2/house_door_closed.png" alt="房门"><figcaption>房门</figcaption></figure></div></div>
<div class="grid" id="grid"></div><p><a href="美术规范.md">查看素材清单与导入规范</a></p></main>
<script>
const assets=[['house_base','房屋主体'],['house_roof','独立屋顶'],['grass','草地'],['road','马路'],['fence','围栏'],['player','玩家'],['zombie','丧尸'],['survivor','来访幸存者'],['metal_cabinet','铁柜'],['metal_shelf','铁架'],['wood_table','木桌'],['wood_chair','木椅'],['wood_cabinet','木柜'],['iron','铁锭'],['wood','木材'],['bear_trap','捕兽夹'],['ballista','巨弩'],['health_bar','血量槽'],['stamina_bar','体力槽']];
const updated=new Set(['iron','health_bar','stamina_bar']);
const variants=[...['player','zombie'].flatMap(type=>[['east','东'],['south','南'],['west','西'],['north','北']].map(([dir,name])=>[type+'_'+dir,(type==='player'?'玩家':'丧尸')+' · '+name])),['bear_trap_hit','捕兽夹 · 命中'],['yard_gate_closed','院门 · 关闭'],['yard_gate_open','院门 · 开启'],['house_door_closed','房门 · 关闭'],['house_door_open','房门 · 开启']];
document.getElementById('grid').innerHTML=[...assets,...variants].map(([id,name])=>{const folder=updated.has(id)||variants.some(v=>v[0]===id)?'sprites-v2':'sprites-v1';return `<figure><a href="${folder}/${id}.png"><img src="${folder}/${id}.png" alt="${name}" loading="lazy"></a><figcaption>${name}<small>${id}.png</small></figcaption></figure>`}).join('');
document.getElementById('directions').innerHTML=[['east','东 →'],['south','南 ↓'],['west','西 ←'],['north','北 ↑']].map(([dir,name])=>`<button data-dir="${dir}">${name}</button>`).join(' ');
document.getElementById('directions').onclick=e=>{const dir=e.target.dataset.dir;if(dir)for(const type of ['player','zombie'])document.getElementById(type+'Dir').src='sprites-v2/'+type+'_'+dir+'.png'};
let hit=false,open=false;
document.getElementById('trapToggle').onclick=()=>{hit=!hit;document.getElementById('trapState').src=hit?'sprites-v2/bear_trap_hit.png':'sprites-v1/bear_trap.png';document.getElementById('trapCaption').textContent=hit?'捕兽夹：命中后闭合':'捕兽夹：张开';document.getElementById('trapToggle').textContent=hit?'展示捕兽夹张开':'展示捕兽夹命中'};
document.getElementById('doorToggle').onclick=()=>{open=!open;document.getElementById('yardState').src='sprites-v2/yard_gate_'+(open?'open':'closed')+'.png';document.getElementById('houseState').src='sprites-v2/house_door_'+(open?'open':'closed')+'.png';document.getElementById('doorToggle').textContent=open?'展示门关闭':'展示门开启'};
document.getElementById('enter').onclick=()=>{const inside=document.getElementById('room').classList.toggle('inside');document.getElementById('state').textContent=inside?'屋内：屋顶隐藏':'屋外：显示屋顶';document.getElementById('enter').textContent=inside?'展示离开房屋':'展示进入房屋'};
for(const [id,max] of [['hp',12],['sp',10]])document.getElementById(id).oninput=e=>{document.getElementById(id+'Fill').style.width=(e.target.value/max*100)+'%';document.getElementById(id+'Value').textContent=e.target.value+' / '+max};
</script></html>
