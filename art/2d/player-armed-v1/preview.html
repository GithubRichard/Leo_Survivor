<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主角持武器动作</title><style>
*{box-sizing:border-box}body{margin:0;background:#252821;color:#ded9c7;font:16px/1.6 system-ui}header,main{max-width:1400px;margin:auto;padding:22px}header{position:sticky;top:0;background:#252821ef;z-index:2;border-bottom:1px solid #62604b}h1{font-size:25px;margin:0 0 5px}h2{font-size:18px;margin:0}p{margin:6px 0;color:#b0b09b}a{color:#c5b376}select,button,input{font:inherit;color:inherit;background:#3c4033;border:1px solid #777256;border-radius:5px;padding:6px;margin:4px}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{border:1px solid #525647;border-radius:7px;overflow:hidden;background:#303428}.card h2,.caption{padding:10px}.card canvas{width:100%;display:block;aspect-ratio:1;background:#3c4034}.light canvas{background:#b5b7a3}.caption{font-size:12px;overflow-wrap:anywhere;color:#b0b09b}.frames{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.frames canvas{width:100%;background:#3c4034}.frames figure{margin:0}.frames figcaption{font-size:13px;overflow-wrap:anywhere}#frameTitle{margin:20px 0 10px}#status{font-size:13px}.hint{font-size:13px}</style>
<header><h1>主角持武器 · 站立 / 奔跑 / 攻击</h1><p>7类武器 · 8方向 · 56张透明图集 · 共392帧（每方向1站立＋3奔跑＋3攻击）</p><label>武器<select id="weapon"></select></label><label>动作<select id="action"><option value="idle">站立</option><option value="run" selected>奔跑</option><option value="attack">攻击</option></select></label><button id="play">暂停</button><button id="step">下一帧</button><label>帧率<input id="fps" type="range" min="3" max="14" value="7"><span id="fpsText">7</span> fps</label><button id="bg">明暗背景</button><label><input type="checkbox" id="align" checked>建议躯干对齐</label><p id="status"></p><p class="hint">奔跑按1→2→3→2循环；攻击按1→2→3播放后回到站立。预览用建议躯干锚点，PNG像素保持原样。<a href="../expansion-v1/preview.html">扩展素材</a> · <a href="../player-run-v1/preview.html">空手奔跑</a> · <a href="README.md">交付说明</a></p></header>
<main><div class="grid" id="grid"></div><h2 id="frameTitle">逐帧对照</h2><label>方向<select id="direction"></select></label><div id="frames" class="frames"></div></main><script src="catalog.js"></script><script src="alignment.js"></script><script>
const plan=window.ARMED_CATALOG,geometry=window.ARMED_ALIGNMENT||{},images=new Map(),groups=new Map(),cards=[];
const weapon=document.getElementById('weapon'),action=document.getElementById('action'),direction=document.getElementById('direction');
for(const w of plan.weapons)weapon.add(new Option(w.label,w.id));for(const d of plan.directions)direction.add(new Option(d.label,d.id));
const key=(w,d,a)=>w+'|'+d+'|'+a;
for(const j of plan.frames){const k=key(j.weapon,j.direction,j.action);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(j)}for(const a of groups.values())a.sort((a,b)=>a.frame-b.frame);
function getImage(file){if(!images.has(file)){const im=new Image();im.src=file;im.onload=()=>{drawAll();status()};im.onerror=()=>{im.failed=true;drawAll();status()};images.set(file,im)}return images.get(file)}
for(const d of plan.directions){const card=document.createElement('article');card.className='card';const title=document.createElement('h2');title.textContent=d.label;const canvas=document.createElement('canvas');canvas.width=480;canvas.height=480;const caption=document.createElement('div');caption.className='caption';card.append(title,canvas,caption);card.onclick=()=>{direction.value=d.id;setupFrames()};document.getElementById('grid').append(card);cards.push({canvas,caption,d:d.id})}
let playing=true,tick=0,last=0,still=[];
function sequence(a){return a==='run'?[1,2,3,2]:a==='attack'?[1,2,3,0,0]:[1]}
function current(d){const seq=sequence(action.value),n=seq[tick%seq.length];return(groups.get(key(weapon.value,d,n===0?'idle':action.value))||[]).find(j=>j.frame===(n||1))}
function registration(j,im){const m=geometry[j.id],cw=Math.floor(im.naturalWidth/3),ch=Math.floor(im.naturalHeight/3);if(document.getElementById("align").checked&&m)return{p:m.torso,unit:m.size[1],size:m.size};return{p:[cw*.5,ch*.42],unit:ch,size:[cw,ch]}}
function fit(d){let l=Infinity,t=Infinity,r=-Infinity,b=-Infinity;for(const a of ['idle','run','attack'])for(const j of groups.get(key(weapon.value,d,a))||[]){const im=getImage(j.file);if(!im.naturalWidth||im.failed)continue;const m=geometry[j.id],reg=registration(j,im),q=m?m.visibleBounds:[0,0,reg.size[0],reg.size[1]];l=Math.min(l,(q[0]-reg.p[0])/reg.unit);t=Math.min(t,(q[1]-reg.p[1])/reg.unit);r=Math.max(r,(q[2]-reg.p[0])/reg.unit);b=Math.max(b,(q[3]-reg.p[1])/reg.unit)}return Number.isFinite(l)?{l,t,r,b}:{l:-.5,t:-.5,r:.5,b:.5}}
function draw(canvas,j,d){const ctx=canvas.getContext("2d");ctx.clearRect(0,0,480,480);if(!j)return;const im=getImage(j.file);if(!im.naturalWidth||im.failed){ctx.fillStyle="#d0c49b";ctx.font="15px system-ui";ctx.textAlign="center";ctx.fillText(im.failed?"图集尚未保存":"加载中",240,240);return}const f=fit(d),reg=registration(j,im),s=420/Math.max(f.r-f.l,f.b-f.t),x=240-(f.l+f.r)*s/2,y=240-(f.t+f.b)*s/2,m=geometry[j.id],sx=Math.floor(j.col*im.naturalWidth/3),sy=Math.floor(j.row*im.naturalHeight/3),ex=Math.floor((j.col+1)*im.naturalWidth/3),ey=Math.floor((j.row+1)*im.naturalHeight/3),rect=m?m.rect:[sx,sy,ex-sx,ey-sy];ctx.drawImage(im,rect[0],rect[1],rect[2],rect[3],x-reg.p[0]*s/reg.unit,y-reg.p[1]*s/reg.unit,rect[2]*s/reg.unit,rect[3]*s/reg.unit)}
function drawAll(){for(const c of cards){const j=current(c.d);draw(c.canvas,j,c.d);c.caption.textContent=j?j.phase+' · '+j.file:''}for(const s of still)draw(s.canvas,s.j,direction.value)}
function setupFrames(){still=[];const box=document.getElementById('frames');box.replaceChildren();const rows=groups.get(key(weapon.value,direction.value,action.value))||[];for(const j of rows){const f=document.createElement('figure'),c=document.createElement('canvas'),cap=document.createElement('figcaption'),link=document.createElement('a');c.width=c.height=480;link.href=j.file;link.textContent=j.frame+' · '+j.phase+'（图集第'+j.cell+'格）';cap.append(link);f.append(c,cap);box.append(f);still.push({canvas:c,j})}drawAll()}
function status(){const loaded=[...images.values()].filter(i=>i.naturalWidth&&!i.failed).length,failed=[...images.values()].filter(i=>i.failed).length;document.getElementById('status').textContent='计划 '+plan.expectedFrames+' 帧；本次已加载 '+loaded+' 张图集'+(failed?'；其中待保存 '+failed+' 张':'')+'。完整交付情况见 validation.json。'}
function refresh(){tick=0;for(const d of plan.directions)for(const a of ['idle','run','attack'])for(const j of groups.get(key(weapon.value,d.id,a))||[])getImage(j.file);setupFrames();status()}
weapon.onchange=action.onchange=refresh;direction.onchange=setupFrames;document.getElementById('align').onchange=drawAll;document.getElementById('bg').onclick=()=>document.body.classList.toggle('light');document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'暂停':'播放'};document.getElementById('step').onclick=()=>{playing=false;document.getElementById('play').textContent='播放';tick++;drawAll()};document.getElementById('fps').oninput=e=>document.getElementById('fpsText').textContent=e.target.value;function loop(now){if(playing&&now-last>1000/Number(document.getElementById('fps').value)){tick++;last=now;drawAll()}requestAnimationFrame(loop)}refresh();requestAnimationFrame(loop);
</script></html>
