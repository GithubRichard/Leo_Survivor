<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>扩展美术素材预览</title>
<style>body{margin:0;background:#222522;color:#ddd9c8;font:16px/1.5 system-ui}header{padding:24px;position:sticky;top:0;background:#222522f0;z-index:2;border-bottom:1px solid #5b5847}h1{font-size:24px;margin:0 0 8px}p{margin:4px 0;color:#aaa996}button,input{background:#36392f;color:#ddd9c8;border:1px solid #6c6748;border-radius:4px;padding:8px;margin:4px}button[aria-pressed=true]{background:#786b3d}main{padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}.card{border:1px solid #494b42;border-radius:6px;overflow:hidden;background:#2d3028}.stage{height:220px;display:flex;align-items:center;justify-content:center;background-color:#34372e;background-image:linear-gradient(45deg,#3b3e341f 25%,transparent 25%,transparent 75%,#3b3e341f 75%),linear-gradient(45deg,#3b3e341f 25%,transparent 25%,transparent 75%,#3b3e341f 75%);background-size:24px 24px;background-position:0 0,12px 12px}.stage img{max-width:94%;max-height:94%;object-fit:contain}.caption{padding:10px}.caption small{color:#9c9e8e;display:block;overflow-wrap:anywhere}a{color:#c6b777}.missing{color:#b3a480}.light .stage{background-color:#b7baa6}.legend{font-size:13px}dialog{max-width:90vw;background:#242720;color:#dedac8;border:1px solid #777158}dialog img{max-width:85vw;max-height:75vh}#summary{font-size:14px}</style>
<header><h1>扩展美术素材</h1><p>暗灰 · 暗黄 · 极简几何 · 透明PNG</p><div id="filters"></div><input id="search" placeholder="搜索名称或文件名" aria-label="搜索素材"><button id="bg">切换明暗背景</button><p id="summary"></p><p class="legend">点击模型可查看原图。红色血条、绿色体力条及普通丧尸等原有素材见<a href="../preview.html">基础素材</a>；<a href="../player-run-v1/preview.html">主角八向奔跑</a>。屋顶与基体分别交付，门与屋顶由程序独立显示。<a href="model-review.html">状态对照</a>。</p></header><main><div class="grid" id="grid"></div></main><dialog id="zoom"><button id="close">关闭</button><p id="ztitle"></p><img id="zimg"></dialog>
<script src="catalog.js"></script><script>
let selected='全部';const all=window.EXPANSION_CATALOG;const filters=document.getElementById('filters'),grid=document.getElementById('grid');for(const name of ['全部',...new Set(all.map(a=>a.category))]){const b=document.createElement('button');b.textContent=name;b.setAttribute('aria-pressed',name===selected);b.onclick=()=>{selected=name;render();for(const x of filters.children)x.setAttribute('aria-pressed',x.textContent===selected)};filters.append(b)}function render(){const q=document.getElementById('search').value.toLowerCase();const rows=all.filter(a=>(selected==='全部'||a.category===selected)&&(a.label+a.id).toLowerCase().includes(q));grid.replaceChildren();let loaded=0;for(const a of rows){const card=document.createElement('div');card.className='card';const stage=document.createElement('div');stage.className='stage';const img=new Image();img.loading='lazy';img.alt=a.label;img.src=a.file;img.onload=()=>{loaded++;update()};img.onerror=()=>{stage.replaceChildren();const t=document.createElement('span');t.className='missing';t.textContent='尚未生成 / 文件缺失';stage.append(t)};img.onclick=()=>{document.getElementById('zimg').src=a.file;document.getElementById('ztitle').textContent=a.label;document.getElementById('zoom').showModal()};stage.append(img);const caption=document.createElement('div');caption.className='caption';const link=document.createElement('a');link.href=a.file;link.textContent=a.label;const small=document.createElement('small');small.textContent=a.file;caption.append(link,small);card.append(stage,caption);grid.append(card)}function update(){document.getElementById('summary').textContent='清单 '+all.length+' 项；当前筛选 '+rows.length+' 项；已加载 '+loaded+' 项（离屏图片按需加载）'}update()}document.getElementById('search').oninput=render;document.getElementById('bg').onclick=()=>document.body.classList.toggle('light');document.getElementById('close').onclick=()=>document.getElementById('zoom').close();render();
</script></html>
