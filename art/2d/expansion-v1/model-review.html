<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>扩展模型状态对照</title><style>body{margin:0;background:#252821;color:#ddd9c8;font:16px/1.6 system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:26px}a{color:#c8ba80}select,button{padding:9px;background:#414438;color:inherit;border:1px solid #797454;border-radius:4px;margin:4px}.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#34372d;border:1px solid #5d604e;padding:12px;border-radius:6px}img{width:100%;height:380px;object-fit:contain}small{color:#a9ab99;overflow-wrap:anywhere}.light .card{background:#b7baa6}.stage{height:380px;display:grid;place-items:center}@media(max-width:600px){.row{grid-template-columns:1fr}img,.stage{height:300px}}</style><main><h1>模型状态对照</h1><p><a href="preview.html">全部146项素材</a> · <a href="../player-run-v1/preview.html">主角八向奔跑</a></p><label>类型 <select id="type"><option value="brute">厚皮者</option><option value="spitter">酸液者</option><option value="demolisher">拆墙者</option><option value="screamer">尖啸者</option><option value="trap">锯齿陷阱</option><option value="chest">储物箱</option><option value="drying">晾肉架</option><option value="freezer">冷柜</option><option value="potato">土豆菜箱</option><option value="vegetable">蔬菜菜箱</option><option value="yard">加固院门</option><option value="door">加固房门</option><option value="food_shop">食品店</option><option value="repair_shop">维修店</option><option value="pharmacy">药店</option><option value="security_room">保安室</option></select></label><label id="dirLabel">朝向 <select id="direction"><option value="south">南</option><option value="east">东</option><option value="west">西</option><option value="north">北</option></select></label><button id="bg">明暗背景</button><div class="row" id="pair"></div><p id="note"></p></main><script>
const enemies=new Set(['brute','spitter','demolisher','screamer']);
const pairs={trap:['serrated_trap_open','serrated_trap_hit','张开','命中'],chest:['storage_chest_closed','storage_chest_open','关闭','打开'],drying:['drying_rack_empty','drying_rack_full','空置','晾肉'],freezer:['freezer_closed','freezer_open','关闭','打开'],potato:['planter_potato_seedling','planter_potato_mature','幼苗','成熟'],vegetable:['planter_vegetable_seedling','planter_vegetable_mature','幼苗','成熟'],yard:['yard_gate_reinforced_closed','yard_gate_reinforced_open','关闭','打开'],door:['house_door_reinforced_closed','house_door_reinforced_open','关闭','打开']};
function show(){const t=document.getElementById('type').value,d=document.getElementById('direction').value,isEnemy=enemies.has(t),isBuilding=!isEnemy&&!pairs[t];document.getElementById('dirLabel').hidden=!isEnemy;const ids=isEnemy?['zombie_'+t+'_'+d,'zombie_'+t+'_'+d+'_windup','基础姿态','攻击前摇']:pairs[t]||[t+'_base',t+'_roof','建筑基体','独立屋顶'];const box=document.getElementById('pair');box.replaceChildren();for(let i=0;i<2;i++){const c=document.createElement('div');c.className='card';const h=document.createElement('h2');h.textContent=ids[i+2];const stage=document.createElement('div');stage.className='stage';const img=new Image();img.alt=ids[i+2];img.src=ids[i]+'.png';img.onerror=()=>stage.textContent='素材尚未保存';stage.append(img);const s=document.createElement('small');s.textContent=ids[i]+'.png';c.append(h,stage,s);box.append(c)}document.getElementById('note').textContent=isBuilding?'基体和屋顶独立交付，进屋后隐藏屋顶。此处按原图独立适配预览；程序接入时需标定相同世界占地及屋顶锚点。':t==='trap'?'命中后保留圆形底座，仅显示闭合的锯齿夹口。':''}
document.getElementById('type').onchange=show;document.getElementById('direction').onchange=show;document.getElementById('bg').onclick=()=>document.body.classList.toggle('light');show();</script></html>
